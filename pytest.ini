[pytest]
# Só a pasta de testes. Sem isto, `pytest` na raiz também importava os scripts soltos de scratch/ (test_*.py), e um
# deles regrava assets/icons/aimedget_icon_clean.svg: o ícone ficava vazio (invisível na bandeja, preto no app).
testpaths = tests
norecursedirs = scratch mockups docs assets dist build .git .venv venv node_modules
