<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vinyl widget</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#e9eef5}

:root{
  --w:960px; --h:540px; --radius:40px;
  --text:#fff; --text-dim:rgba(255,255,255,.64); --track:rgba(255,255,255,.22);
  --vinyl:420px; --vinyl-x:440px; --vinyl-y:60px;
  --arm-left:731.8px; --arm-top:23.0px; --arm-w:172.4px; --arm-h:434.0px; --arm-origin:73.2px 62.0px;
  --base-left:757.0px; --base-top:28.9px; --base-w:112.2px; --base-h:171.7px;
  --arm-play-angle:17.7deg; --arm-park-angle:-22.0deg; --drift:0deg; --drift-max:4.5;
  --shadow-rest:drop-shadow(8px 14px 8px rgba(0,15,40,.40));
  --shadow-lift:drop-shadow(14px 30px 16px rgba(0,15,40,.30));
  --shadow-down:drop-shadow(4px 7px 5px rgba(0,15,40,.50));
  --font:"Inter","SF Pro Display","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
.widget{position:relative;width:var(--w);height:var(--h);border-radius:var(--radius);overflow:hidden;
  background:url(assets/widget-bg.svg) center/100% 100%;font-family:var(--font);color:var(--text);
  box-shadow:0 28px 56px -18px rgba(5,40,80,.55),0 2px 0 rgba(255,255,255,.08) inset;user-select:none}
.info{position:absolute;left:56px;top:58px;width:364px}
.title{font-size:38px;font-weight:650;letter-spacing:-.02em;line-height:1.1;margin:0}
.artist{font-size:21px;color:var(--text-dim);margin:8px 0 0}
.progress{position:absolute;left:56px;top:326px;width:364px}
.bar{position:relative;height:6px;border-radius:3px;background:var(--track);cursor:pointer}
.bar:before{content:"";position:absolute;inset:-12px 0}
.fill{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:#fff;width:0}
.knob{position:absolute;top:50%;width:14px;height:14px;margin:-7px 0 0 -7px;border-radius:50%;background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.35);left:0}
.times{display:flex;justify-content:space-between;margin-top:12px;font-size:13px;color:var(--text-dim);font-variant-numeric:tabular-nums}
.controls{position:absolute;left:56px;top:402px;width:364px;display:flex;justify-content:space-between;align-items:flex-start}
.pair{display:flex;gap:16px}
.pill{all:unset;box-sizing:border-box;cursor:pointer;height:60px;border-radius:999px;display:grid;place-items:center;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.18),rgba(255,255,255,.07));
  box-shadow:inset 0 1px 0 rgba(255,255,255,.28),inset 0 -2px 6px rgba(0,10,30,.25),0 10px 20px -6px rgba(0,10,30,.55),0 0 0 1px rgba(255,255,255,.10);
  backdrop-filter:blur(10px);transition:transform .15s,box-shadow .15s}
.pill:hover{transform:translateY(-1px)}
.pill:active{transform:translateY(1px);box-shadow:inset 0 3px 8px rgba(0,10,30,.5),0 0 0 1px rgba(255,255,255,.10)}
.pill:focus-visible{outline:2px solid #fff;outline-offset:4px}
.pill img{width:26px;height:26px;display:block}
.playwrap{width:132px}
.play{width:132px}
.skip{width:92px}
.lbl{display:block;margin-top:10px;text-align:center;font-size:14px;color:var(--text-dim);letter-spacing:.03em}
.disc{position:absolute;left:var(--vinyl-x);top:var(--vinyl-y);width:var(--vinyl);height:var(--vinyl)}
.disc-shadow{position:absolute;inset:2%;border-radius:50%;box-shadow:0 20px 44px rgba(0,10,30,.55)}
.spin{position:absolute;inset:0;animation:spin 3.4s linear infinite;animation-play-state:paused}
.spin.on{animation-play-state:running}
.spin>*{position:absolute;display:block}
.cover{left:32%;top:32%;width:36%;height:36%;border-radius:50%;object-fit:cover}
.vinyl{inset:0;width:100%;height:100%}
.glare{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.arm-base{position:absolute;left:var(--base-left);top:var(--base-top);width:var(--base-w);height:var(--base-h);pointer-events:none}

/* tonearm: parked -> .in (swing + lower onto record) -> .on (tracking) -> .out (lift + swing back) */
.arm{position:absolute;left:var(--arm-left);top:var(--arm-top);width:var(--arm-w);height:var(--arm-h);
  transform-origin:var(--arm-origin);transform:rotate(var(--arm-park-angle));pointer-events:none;filter:var(--shadow-rest)}
.arm img{width:100%;height:100%;display:block}
.arm.in{animation:armIn 1.5s cubic-bezier(.45,0,.25,1) forwards}
.arm.on{transform:rotate(calc(var(--arm-play-angle) + var(--drift)));filter:var(--shadow-down)}
.arm.out{animation:armOut 1.2s cubic-bezier(.5,0,.3,1) forwards}
@keyframes armIn{
  0%{transform:rotate(var(--arm-park-angle));filter:var(--shadow-rest)}
  20%{transform:rotate(var(--arm-park-angle));filter:var(--shadow-lift)}
  72%{transform:rotate(calc(var(--arm-play-angle) + var(--drift) + 1.6deg));filter:var(--shadow-lift)}
  86%{transform:rotate(calc(var(--arm-play-angle) + var(--drift) - .4deg));filter:var(--shadow-down)}
  100%{transform:rotate(calc(var(--arm-play-angle) + var(--drift)));filter:var(--shadow-down)}
}
@keyframes armOut{
  0%{transform:rotate(calc(var(--arm-play-angle) + var(--drift)));filter:var(--shadow-down)}
  18%{transform:rotate(calc(var(--arm-play-angle) + var(--drift)));filter:var(--shadow-lift)}
  100%{transform:rotate(var(--arm-park-angle));filter:var(--shadow-rest)}
}
@keyframes spin{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation-duration:12s}.arm.in,.arm.out{animation-duration:.01s}}

</style></head>
<body>
<div class="widget">
  <div class="info"><h1 class="title">Main Theme</h1><p class="artist">MD Studio</p></div>
  <div class="progress">
    <div class="bar" role="slider" aria-label="Progress"><div class="fill"></div><div class="knob"></div></div>
    <div class="times"><span class="cur">0:00</span><span class="dur">0:00</span></div>
  </div>
  <div class="controls">
    <div class="playwrap">
      <button class="pill play main" aria-label="Play"><img src="assets/icon-play.svg" data-play="assets/icon-play.svg" data-pause="assets/icon-pause.svg" alt=""></button>
      <span class="lbl">Play</span>
    </div>
    <div class="pair">
      <button class="pill skip prev" aria-label="Previous"><img src="assets/icon-prev.svg" alt=""></button>
      <button class="pill skip next" aria-label="Next"><img src="assets/icon-next.svg" alt=""></button>
    </div>
  </div>
  <img class="arm-base" src="assets/tonearm-base.svg" alt="">
  <div class="disc">
    <div class="disc-shadow"></div>
    <div class="spin">
      <img class="cover" src="assets/cover-placeholder.svg" alt="Album cover">
      <img class="vinyl" src="assets/vinyl.svg" alt="">
    </div>
    <img class="glare" src="assets/vinyl-glare.svg" alt="">
  </div>
  <div class="arm"><img src="assets/tonearm.svg" alt=""></div>
</div>
<script>
(function(){
  const w=document.querySelector('.widget'),spin=w.querySelector('.spin'),arm=w.querySelector('.arm'),
        icon=w.querySelector('.main img'),lbl=w.querySelector('.lbl'),mainBtn=w.querySelector('.main'),
        bar=w.querySelector('.bar'),fill=w.querySelector('.fill'),knob=w.querySelector('.knob'),
        cur=w.querySelector('.cur'),dur=w.querySelector('.dur');
  const DUR=222, DRIFT=parseFloat(getComputedStyle(w).getPropertyValue('--drift-max'))||4.5;
  let t=0,playing=false,raf=0,last=0;
  const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
  function draw(){const p=t/DUR;fill.style.width=p*100+'%';knob.style.left=p*100+'%';cur.textContent=fmt(t);
    w.style.setProperty('--drift',(p*DRIFT).toFixed(2)+'deg');}      // needle slowly tracks inward
  function tick(ts){ if(!playing)return; t=Math.min(DUR,t+(ts-last)/1000); last=ts; draw();
    if(t>=DUR){set(false);t=0;draw();return;} raf=requestAnimationFrame(tick);}
  function set(on){
    playing=on; icon.src=on?icon.dataset.pause:icon.dataset.play; mainBtn.setAttribute('aria-label',on?'Pause':'Play'); lbl.textContent=on?'Pause':'Play';
    arm.classList.remove('in','on','out'); void arm.offsetWidth; arm.classList.add(on?'in':'out');
    if(on){last=performance.now();raf=requestAnimationFrame(tick);} else {spin.classList.remove('on');cancelAnimationFrame(raf);} }
  arm.addEventListener('animationend',e=>{
    if(e.animationName==='armIn'){arm.classList.remove('in');arm.classList.add('on');spin.classList.add('on');}
    if(e.animationName==='armOut'){arm.classList.remove('out');}
  });
  mainBtn.addEventListener('click',()=>set(!playing));
  w.querySelector('.prev').addEventListener('click',()=>{t=0;draw();});
  w.querySelector('.next').addEventListener('click',()=>{t=0;draw();});
  bar.addEventListener('click',e=>{const r=bar.getBoundingClientRect();t=Math.max(0,Math.min(1,(e.clientX-r.left)/r.width))*DUR;draw();});
  dur.textContent=fmt(DUR); draw();
})();
</script>
</body></html>
