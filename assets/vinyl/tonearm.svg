<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 1000" width="800" height="2000" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title>Tonearm (pivot at 230,130)</title>
  <defs>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2b3441"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>
    <radialGradient id="pivot" cx="50%" cy="40%" r="60%"><stop offset="0" stop-color="#3a4656"/><stop offset="1" stop-color="#10151c"/></radialGradient>
    <filter id="sh" x="-30%" y="-10%" width="160%" height="130%"><feDropShadow dx="6" dy="10" stdDeviation="8" flood-opacity="0.35"/></filter>
  </defs>

  <!-- pivot base -->
  <circle cx="230" cy="130" r="105" fill="#0b1a2a" fill-opacity="0.25" stroke="#0a1118" stroke-width="5"/>
  <circle cx="230" cy="130" r="82" fill="none" stroke="#fff" stroke-opacity="0.15" stroke-width="2"/>

  <g filter="url(#sh)">
    <!-- arm tube: straight, then curving toward the record -->
    <path id="tube" d="M230,130 L224,700 C222,790 196,840 140,866" fill="none" stroke="#6f7b87" stroke-width="18" stroke-linecap="round"/>
    <path d="M230,130 L224,700 C222,790 196,840 140,866" fill="none" stroke="#d3dae2" stroke-width="13" stroke-linecap="round"/>
    <path d="M227,130 L221,700 C219,790 194,838 138,862" fill="none" stroke="#fff" stroke-opacity="0.8" stroke-width="3.5" stroke-linecap="round"/>

    <!-- counterweight / back end -->
    <path d="M150,78 H235 a10,10 0 0 1 10,10 V148 a10,10 0 0 1 -10,10 H165 a15,15 0 0 1 -15,-15 Z" fill="url(#head)"/>
    <rect x="160" y="88" width="70" height="6" rx="3" fill="#fff" fill-opacity="0.15"/>

    <!-- hub -->
    <circle cx="230" cy="130" r="30" fill="url(#pivot)"/>
    <circle cx="230" cy="130" r="30" fill="none" stroke="#fff" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="230" cy="130" r="9" fill="#cfd8e2"/>

    <!-- headshell + cartridge at the curved tip (angled along the curve) -->
    <g transform="translate(140,866) rotate(155)">
      <rect x="-6" y="-17" width="74" height="34" rx="8" fill="url(#head)"/>
      <rect x="2" y="-12" width="52" height="5" rx="2.5" fill="#fff" fill-opacity="0.15"/>
      <rect x="40" y="-11" width="26" height="22" rx="4" fill="#e7ecf1"/>
      <!-- stylus -->
      <path d="M66,-3 L84,0 L66,3 Z" fill="#9aa6b2"/>
    </g>
  </g>
</svg>